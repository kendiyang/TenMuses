name: Integration tests (on-demand)

on:
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start integration services (docker-compose)
        run: |
          docker compose -f docker-compose.integration.yml up -d

      - name: Wait for Postgres readiness
        run: |
          for i in {1..30}; do
            docker exec tenmuses_integration_db pg_isready -U postgres && break || sleep 1
          done

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run integration tests
        working-directory: backend
        env:
          RUN_LANGGRAPH_INTEGRATION: 'true'
        run: |
          pytest -q -m integration

      - name: Tear down integration services
        if: always()
        run: |
          docker compose -f docker-compose.integration.yml down -v
